services:
  db:
    image: postgres:16-alpine
    container_name: fundsroom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundsroom
      POSTGRES_PASSWORD: fundsroom123
      POSTGRES_DB: fundsroom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fundsroom-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fundsroom:fundsroom123@db:5432/fundsroom?schema=public
      JWT_SECRET: fundsroom-super-secret-jwt-key-2024
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      # Optional Vercel Blob for product images (leave blank to disable uploads)
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: fundsroom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: